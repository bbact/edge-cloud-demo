<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>边缘到云端实时监测</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Edge → Kafka → 实时告警 → Redis</p>
      <h1>边缘到云端实时监测</h1>
    </div>
    <div class="status" id="link-status">正在连接</div>
  </header>
  <section class="devices" id="devices"></section>
  <section class="alerts">
    <div class="section-head">
      <h2>告警记录</h2>
      <p>温度超过 80°C 时记一条，回到阈值以内时记恢复。</p>
    </div>
    <div id="alert-list"></div>
  </section>
  <script src="/app.js"></script>
</body>
</html>
